<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mech Drone viewer · Nehal Nevle</title>
  <meta name="description" content="Interactive 3D viewer for the Mech Drone model by Willy Decarpentrie (CC BY 4.0).">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0a0f; color: #f4efe4; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; }
    .bar { position: fixed; left: 16px; right: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    a.back { background: #5b4ee6; color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-weight: 600; }
    a:focus-visible { outline: 3px solid #d9f45b; outline-offset: 3px; }
    .status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; background: rgba(23,21,29,.85); padding: 8px 12px; border-radius: 999px; }
    .credit { position: fixed; left: 16px; right: 16px; bottom: 16px; font-size: 13px; color: #a7a2b3; }
    .credit a { color: #f4efe4; }
  </style>
</head>
<body>
  <div id="stage" aria-label="3D model viewer. Drag to orbit, scroll or pinch to zoom." role="img"></div>
  <div class="bar">
    <a class="back" href="../">← Back to portfolio</a>
    <span class="status" id="status" aria-live="polite">Loading model (≈15 MB)…</span>
  </div>
  <p class="credit">This work is based on "<a href="https://sketchfab.com/3d-models/mech-drone-8d06874aac5246c59edb4adbe3606e0e">Mech Drone</a>" by <a href="https://sketchfab.com/skudgee">Willy Decarpentrie</a>, licensed under <a href="http://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Third-party model, shown here as a 3D viewer demo.</p>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/" } }
  </script>
  <script type="module">
    const status = document.getElementById('status');
    try {
      const THREE = await import('three');
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      const stage = document.getElementById('stage');
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      stage.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0a0f);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2733, 2.2));
      const key = new THREE.DirectionalLight(0xffd2b4, 2.5); key.position.set(3, 5, 4); scene.add(key);
      const rim = new THREE.DirectionalLight(0x7d70ff, 2); rim.position.set(-4, 2, -3); scene.add(rim);
      const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 1000);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      controls.autoRotate = !reduce;
      controls.autoRotateSpeed = 0.8;
      let mixer = null;
      const clock = new THREE.Clock();
      new GLTFLoader().load('scene.glb', (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model, true);
        const size = box.getSize(new THREE.Vector3()).length();
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        scene.add(model);
        camera.position.set(size * 1.0, size * 0.55, size * 1.4);
        camera.near = size / 100; camera.far = size * 20; camera.updateProjectionMatrix();
        controls.target.set(0, 0, 0);
        if (gltf.animations.length && !reduce) {
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
        }
        status.textContent = 'Drag to orbit · scroll to zoom';
      }, (ev) => {
        if (ev.total) status.textContent = `Loading model ${Math.round((100 * ev.loaded) / ev.total)}%`;
      }, (err) => {
        console.error('Mech Drone: model failed to load', err);
        status.textContent = 'Model failed to load';
      });
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
      renderer.setAnimationLoop(() => {
        if (mixer) mixer.update(clock.getDelta());
        controls.update();
        renderer.render(scene, camera);
      });
    } catch (err) {
      console.error('Mech Drone: viewer could not start', err);
      status.textContent = 'WebGL viewer unavailable in this browser';
    }
  </script>
</body>
</html>
